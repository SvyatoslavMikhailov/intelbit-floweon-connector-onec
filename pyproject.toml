[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelbit-river-connector-onec"
version = "0.2.0"
description = "Коннектор 1С (УТ 11.5, КА 2.5, ERP 2.5) для Интелбит:Река"
authors = [{ name = "Святослав Михайлов", email = "vceo@intelbit.ru" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "tenacity>=8.5",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "pytest-httpx", "lxml-stubs", "types-PyYAML", "fakeredis", "fastapi"]

[project.urls]
Homepage = "https://github.com/SvyatoslavMikhailov/intelbit-river-connector-onec"
Repository = "https://github.com/SvyatoslavMikhailov/intelbit-river-connector-onec"
Documentation = "https://github.com/SvyatoslavMikhailov/intelbit-river-connector-onec/tree/main/docs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["celpy", "celpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dateutil", "dateutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not contract'"
markers = [
    "contract: контрактные тесты с полным FastAPI-моком 1С сервера",
]
